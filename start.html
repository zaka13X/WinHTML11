<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Menu</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100%;
            height: 100%;
            background: rgba(32, 32, 32, 0.85); /* Fluent design dark theme background */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            
            /* Applies custom vector pointer tracking from system32 folder ONLY inside Start Menu bounds */
            cursor: url('system32/cursor.svg'), auto; 
        }

        /* Search Bar Input Container */
        .search-container {
            width: 100%;
            margin-bottom: 24px;
        }

        .search-bar {
            width: 100%;
            padding: 8px 16px;
            background: rgba(45, 45, 45, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid #60cdff; /* Accent-colored underline */
            border-radius: 4px;
            color: #ccc;
            font-size: 13px;
        }

        /* Section Title Layouts */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 10px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
        }

        .all-apps-btn {
            font-size: 11px;
            color: #60cdff;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .all-apps-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Pinned Items Grid View (6 columns) */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            row-gap: 16px;
            margin-bottom: 28px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .app-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .app-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .app-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            max-width: 64px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Recommended Section Styling (2 columns) */
        .recommended-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 10px;
            margin-bottom: auto; /* Pushes profile bar down */
        }

        .rec-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .rec-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .rec-icon {
            font-size: 20px;
        }

        .rec-info {
            display: flex;
            flex-direction: column;
        }

        .rec-name {
            font-size: 12px;
            font-weight: 500;
        }

        .rec-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* User Account Profile Bottom Bar */
        .profile-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: rgba(24, 24, 24, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .user-info:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #60cdff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #1c1c1c;
        }

        .username {
            font-size: 12px;
            font-weight: 500;
        }

        .power-btn {
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .power-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <!-- Search Box Segment -->
    <div class="search-container">
        <div class="search-bar">🔍 Type here to search</div>
    </div>

    <!-- Pinned Applications Section -->
    <div>
        <div class="section-header">
            <span class="section-title">Pinned</span>
            <button class="all-apps-btn" onclick="alert('Displaying App Index...')">All apps &gt;</button>
        </div>
        
        <div class="apps-grid">
            <div class="app-item" onclick="launch('/browser.html', 'Microsoft Edge')">
                <div class="app-icon">🌐</div>
                <div class="app-name">Edge</div>
            </div>
            <div class="app-item" onclick="launch('/games.html', 'Games')">
                <div class="app-icon">🎮</div>
                <div class="app-name">Games</div>
            </div>
            <div class="app-item" onclick="launch('/proxy.html', 'Proxy')">
                <div class="app-icon">🛡️</div>
                <div class="app-name">Proxy</div>
            </div>
            <div class="app-item" onclick="launch('/settings.html', 'Settings')">
                <div class="app-icon">⚙️</div>
                <div class="app-name">Settings</div>
            </div>
            <div class="app-item" onclick="launch('/files.html', 'File Explorer')">
                <div class="app-icon">📁</div>
                <div class="app-name">Files</div>
            </div>
            <div class="app-item" onclick="launch('/networks.html', 'Network Settings')">
                <div class="app-icon">📶</div>
                <div class="app-name">Network</div>
            </div>
        </div>
    </div>

    <!-- Recommended Documents Section -->
    <div>
        <div class="section-header">
            <span class="section-title">Recommended</span>
        </div>

        <div class="recommended-layout">
            <div class="rec-item" onclick="launch('/system32/winver.html', 'About Windows')">
                <div class="rec-icon">ℹ️</div>
                <div class="rec-info">
                    <span class="rec-name">About Windows</span>
                    <span class="rec-time">Just now</span>
                </div>
            </div>
            <div class="rec-item" onclick="launch('/networks.html', 'Network Settings')">
                <div class="rec-icon">📶</div>
                <div class="rec-info">
                    <span class="rec-name">Ethernet Status</span>
                    <span class="rec-time">2h ago</span>
                </div>
            </div>
        </div>
    </div>

    <!-- System User Profile Bottom Tray -->
    <div class="profile-bar">
        <div class="user-info" onclick="launch('/system32/winver.html', 'About Windows')">
            <div class="avatar">U</div>
            <span class="username">Guest User</span>
        </div>
        <div class="power-btn" onclick="launch('/notepad.html', 'Get fooled - Its just Notepad')">📝</div>
    </div>

    <!-- Frame Shell Action Engine Interceptor -->
    <script>
        // Communicates back up to parent window frame manager logic
        function launch(url, title) {
            if (window.parent && typeof window.parent.openApp === 'function') {
                window.parent.openApp(url, title);
            } else {
                // Standalone fallback notification
                alert("Launching " + title + " pointing to location: " + url);
            }
        }
    </script>
</body>
</html>
