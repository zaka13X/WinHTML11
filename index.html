<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinHTML11</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Desktop Background */
        .desktop {
            width: 100%;
            height: 100%;
            background-image: url('https://winblogs.thesourcemediaassets.com/sites/2/2021/10/Windows-11-Bloom-Screensaver-Dark-scaled.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        /* Desktop Shortcuts */
        .shortcut {
            width: 80px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: background 0.2s;
        }

        .shortcut:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shortcut img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
        }

        .shortcut span {
            color: white;
            font-size: 12px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Authentic Windows 11 App Window */
        .window {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 70%;
            height: 70%;
            background: rgba(28, 28, 28, 0.85); /* Windows dark theme look */
            backdrop-filter: blur(30px);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        /* Hidden State for Window */
        .window.hidden {
            display: none;
        }

        /* Window Title Bar (Draggable Zone) */
        .title-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(32, 32, 32, 0.6);
            cursor: default; /* Drag trigger style */
            padding-left: 16px;
        }

        .window-title {
            font-size: 12px;
            color: #ffffff;
        }

        /* Windows style controls (Right side aligned) */
        .controls {
            display: flex;
            height: 100%;
        }

        .control-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-close:hover {
            background-color: #e81123 !important; /* Authentic Windows red close button click state */
        }

        /* Iframe Content Area */
        .content {
            flex: 1;
            border: none;
            background: #1f1f1f;
        }

        /* Windows 11 Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(32, 32, 32, 0.85); /* Matched to system dark mode taskbar */
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .taskbar-center {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .taskbar-icon {
            width: 36px;
            height: 36px;
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .taskbar-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

    <script>
        const appWindow = document.getElementById('app-window');
        const appFrame = document.getElementById('app-frame');
        const windowTitle = document.getElementById('window-title');
        const windowHeader = document.getElementById('window-header');

        // Toggle app window display
        function openApp(url, title) {
            windowTitle.textContent = title;
            appFrame.src = url;
            appWindow.classList.remove('hidden');
        }

        function closeApp() {
            appWindow.classList.add('hidden');
            appFrame.src = ''; // Flush viewport allocation memory
        }

        // --- Native Windows 11 Drag Logic ---
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        windowHeader.addEventListener('mousedown', function(e) {
            // Do not drag if user clicks top-right control action buttons
            if (e.target.classList.contains('control-btn')) return;

            isDragging = true;
            
            // Capture initial screen coordinate points
            startX = e.clientX;
            startY = e.clientY;

            // Capture initial positions of bounding window styles
            const rect = appWindow.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            // Prevent text highlighting triggers during motion actions
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;

            // Calculate exact translation offset distance
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            // Apply style recalculations directly to the window element container
            appWindow.style.left = (initialLeft + deltaX) + 'px';
            appWindow.style.top = (initialTop + deltaY) + 'px';
            
            // Unset bottom/right percent dimensions safely to maintain static sizing bounds
            appWindow.style.right = 'auto';
            appWindow.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
    </script>
