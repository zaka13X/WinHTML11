<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Desktop Background */
        .desktop {
            width: 100%;
            height: 100%;
            background-image: url('https://winblogs.thesourcemediaassets.com/sites/2/2021/10/Windows-11-Bloom-Screensaver-Dark-scaled.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        /* Desktop Shortcuts */
        .shortcut {
            width: 80px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: background 0.2s;
        }

        .shortcut:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shortcut img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
        }

        .shortcut span {
            color: white;
            font-size: 12px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Windows 11 App Window */
        .window {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 70%;
            height: 70%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        /* Hidden State for Window */
        .window.hidden {
            display: none;
        }

        /* Window Title Bar */
        .title-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            background: rgba(255, 255, 255, 0.4);
        }

        .window-title {
            font-size: 12px;
            color: #333;
        }

        /* Window Controls (Minimize, Maximize, Close) */
        .controls {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-close { background-color: #ff5f56; }
        .btn-min { background-color: #ffbd2e; }
        .btn-max { background-color: #27c93f; }

        /* Iframe Content */
        .content {
            flex: 1;
            border: none;
            background: white;
        }

        /* Windows 11 Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(243, 243, 243, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .taskbar-center {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .taskbar-icon {
            width: 36px;
            height: 36px;
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .taskbar-icon:hover {
            background: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

    <script>
        const appWindow = document.getElementById('appWindow');
        const appFrame = document.getElementById('appFrame');
        const windowTitle = document.getElementById('windowTitle');

        // Function to launch app into iframe
        function openApp(url, name) {
            appFrame.src = url;
            windowTitle.innerText = name;
            appWindow.classList.remove('hidden');
        }

        // Function to close window
        function closeApp() {
            appWindow.classList.add('hidden');
            appFrame.src = '';
