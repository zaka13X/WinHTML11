<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinHTML11 Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }
        /* Top Navigation Controls Bar */
        .controls-bar {
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .url-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="url"] {
            flex-grow: 1;
            padding: 10px 14px;
            font-size: 15px;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus {
            border-color: #bb86fc;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            background-color: #bb86fc;
            color: #121212;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #da9eff;
        }
        .toggle-btn {
            background-color: #333333;
            color: #e0e0e0;
            border: 1px solid #444444;
            padding: 10px 14px;
            font-size: 12px;
            white-space: nowrap;
        }
        .toggle-btn.active-engine {
            background-color: #03dac6;
            color: #121212;
            border-color: #03dac6;
        }
        
        /* Multi-Tab Bar Container */
        .tabs-container {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        .tab {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            color: #a0a0a0;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #3d3d3d;
            user-select: none;
            gap: 8px;
            max-width: 160px;
            white-space: nowrap;
        }
        .tab.active {
            background: #bb86fc;
            color: #121212;
            border-color: #bb86fc;
            font-weight: 600;
        }
        .tab-close {
            font-weight: bold;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: background 0.2s;
        }
        .tab.active .tab-close:hover {
            background: rgba(0,0,0,0.2);
        }
        .tab:not(.active) .tab-close:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }
        .add-tab-btn {
            background: #2a2a2a;
            color: #bb86fc;
            border: 1px dashed #bb86fc;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
        }
        .add-tab-btn:hover {
            background: #332940;
        }

        /* Rendering Environment Frame viewports */
        .viewer-container {
            flex-grow: 1;
            position: relative;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            display: none;
        }
        iframe.active {
            display: block;
        }
        
        #error-banner {
            display: none;
            padding: 10px 14px;
            background-color: #cf6679;
            color: #ffffff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <div class="tabs-container" id="tabsContainer">
            <!-- Dynamic tabs generate here -->
            <button class="tab add-tab-btn" onclick="createNewTab()">+ New Tab</button>
        </div>
        <div class="url-row">
            <button class="toggle-btn" id="engineToggle" onclick="toggleEngine()">Engine: Corsway</button>
            <input type="url" id="urlInput" placeholder="https://google.com" value="">
            <button onclick="triggerLoad()">Go</button>
        </div>
    </div>
    
    <div id="error-banner"></div>
    
    <div class="viewer-container" id="viewerContainer">
        <!-- Dynamic iframes load here -->
    </div>
        <script>
        let currentEngine = "corsway"; // Options: "corsway" or "corsanywhere"
        let proxyBase = "https://proxy.2677929.xyz/";
        
        let tabCount = 0;
        let activeTabId = null;
        const tabsData = {};

        // Run startup routines strictly after the webserver DOM elements initialize
        window.onload = function() {
            // ====================================================================
            // DEFAULT STARTUP URL ASSIGNED
            // ====================================================================
            createNewTab("https://zaka13x.github.io/WinHTML11/edge/nt.html");
        };

        function toggleEngine() {
            const btn = document.getElementById('engineToggle');
            if (currentEngine === "corsway") {
                currentEngine = "corsanywhere";
                proxyBase = "https://cors-anywhere.herokuapp.com";
                btn.textContent = "CORS Anywhere";
                btn.classList.add('active-engine');
            } else {
                currentEngine = "corsway";
                proxyBase = "https://proxy.2677929.xyz/";
                btn.textContent = "Corsway";
                btn.classList.remove('active-engine');
            }
        }

        function createNewTab(initialUrl = "") {
            tabCount++;
            const tabId = `tab-${tabCount}`;

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `btn-${tabId}`;
            tabEl.onclick = (e) => {
                if(e.target.classList.contains('tab-close')) return;
                switchTab(tabId);
            };
            
            let displayTitle = "New Tab";
            if (initialUrl) {
                try { displayTitle = new URL(initialUrl).hostname; } catch(e){}
            }

            tabEl.innerHTML = `
                <span class="tab-title">${displayTitle}</span>
                <span class="tab-close" onclick="closeTab('${tabId}')">×</span>
            `;

            const container = document.getElementById('tabsContainer');
            container.insertBefore(tabEl, container.lastElementChild);

            const iframe = document.createElement('iframe');
            iframe.id = `frame-${tabId}`;
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
            document.getElementById('viewerContainer').appendChild(iframe);

            tabsData[tabId] = { url: initialUrl };

            switchTab(tabId);
            if(initialUrl) {
                executeProxyFetch(tabId, initialUrl);
            }
        }

        function switchTab(tabId) {
            activeTabId = tabId;

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));

            document.getElementById(`btn-${tabId}`).classList.add('active');
            document.getElementById(`frame-${tabId}`).classList.add('active');

            document.getElementById('urlInput').value = tabsData[tabId].url;
            document.getElementById('error-banner').style.display = 'none';
        }

        function closeTab(tabId) {
            const tabBtn = document.getElementById(`btn-${tabId}`);
            const tabFrame = document.getElementById(`frame-${tabId}`);
            
            if(tabBtn) tabBtn.remove();
            if(tabFrame) tabFrame.remove();
            delete tabsData[tabId];

            if (activeTabId === tabId) {
                const remainingTabs = Object.keys(tabsData);
                if(remainingTabs.length > 0) {
                    switchTab(remainingTabs[remainingTabs.length - 1]);
                } else {
                    createNewTab("");
                }
            }
        }

        function triggerLoad() {
            if(!activeTabId) return;
            const inputUrl = document.getElementById('urlInput').value.trim();
            if(!inputUrl) return;
            
            executeProxyFetch(activeTabId, inputUrl);
        }

        async function executeProxyFetch(tabId, inputUrl) {
            let targetUrl = inputUrl;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }
            
            tabsData[tabId].url = targetUrl;
            document.getElementById('urlInput').value = targetUrl;

            try {
                document.querySelector(`#btn-${tabId} .tab-title`).textContent = new URL(targetUrl).hostname;
            } catch(e){}

            const errorBanner = document.getElementById('error-banner');
            const iframe = document.getElementById(`frame-${tabId}`);
            errorBanner.style.display = 'none';

            const targetProxyUrl = `${proxyBase}${targetUrl}`;

            const requestHeaders = new Headers();
            if (currentEngine === "corsanywhere") {
                requestHeaders.append("X-Requested-With", "XMLHttpRequest");
            }

            try {
                const response = await fetch(targetProxyUrl, {
                    method: 'GET',
                    headers: requestHeaders
                });
                
                if (!response.ok) {
                    if (currentEngine === "corsanywhere" && response.status === 403) {
                        throw new Error("CORS Anywhere requires temporary access activation. Click the error to activate.");
                    }
                    throw new Error(`error: ${response.status}`);
                }
                
                let rawHtml = await response.text();
                
                // Disarm frame-busting scripts
                rawHtml = rawHtml
                    .replace(/top\.location/g, 'self.location')
                    .replace(/window\.top/g, 'window.self')
                    .replace(/window\.frameElement/g, 'null')
                    .replace(/parent\.location/g, 'self.location');
                
                const parsedUrl = new URL(targetUrl);
                const targetOrigin = parsedUrl.origin;

                // Live DOM Observer script
                const injectionScript = `
                    <script>
                        (function() {
                            const PROXY = "${proxyBase}";
                            const ORIGIN = "${targetOrigin}";

                            function rewriteUrl(url) {
                                if (!url) return url;
                                if (url.startsWith('javascript:') || url.startsWith('data:')) return url;
                                if (url.startsWith(PROXY)) return url;
                                
                                if (url.startsWith('/')) {
                                    return PROXY + ORIGIN + url;
                                }
                                if (!/^https?:\/\//i.test(url)) {
                                    return PROXY + ORIGIN + '/' + url;
                                }
                                return PROXY + url;
                            }

                            function processElements() {
                                document.querySelectorAll('a[href], link[href], script[src], img[src], form[action]').forEach(el => {
                                    if (el.tagName === 'A' || el.tagName === 'LINK') {
                                        const href = el.getAttribute('href');
                                        if (href && !href.startsWith(PROXY)) el.setAttribute('href', rewriteUrl(href));
                                    } else if (el.tagName === 'SCRIPT' || el.tagName === 'IMG') {
                                        const src = el.getAttribute('src');
                                        if (src && !src.startsWith(PROXY)) el.setAttribute('src', rewriteUrl(src));
                                    } else if (el.tagName === 'FORM') {
                                        const action = el.getAttribute('action');
                                        if (action && !action.startsWith(PROXY)) el.setAttribute('action', rewriteUrl(action));
                                    }
                                });
                            }

                            window.addEventListener('DOMContentLoaded', processElements);
                            const observer = new MutationObserver(processElements);
                            observer.observe(document.documentElement, { childList: true, subtree: true });
                        })();
                    <\/script>
                `;

                const baseTag = `<base href="${targetOrigin}${parsedUrl.pathname}">`;
                iframe.srcdoc = baseTag + injectionScript + rawHtml;
            } catch (err) {
                console.error(err);
                errorBanner.textContent = `Render Error: ${err.message}`;
                errorBanner.style.display = 'block';
                
                if (currentEngine === "corsanywhere" && err.message.includes("activation")) {
                    errorBanner.style.cursor = "pointer";
                    errorBanner.onclick = () => window.open("https://herokuapp.comcorsdemo", "_blank");
                } else {
                    errorBanner.style.cursor = "default";
                    errorBanner.onclick = null;
                }
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') triggerLoad();
        });
    </script>
</body>
</html>
