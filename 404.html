<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Background Container */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Replace the placeholder string below with your actual background image URL */
            background-image: url('https://cdn.wallpaperhub.app/cloudcache/b/4/1/3/3/2/b4133264633839c4c92dbe2cdf509ccd338da528.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6);
            z-index: 1;
        }

        /* Overlay Content Layer */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        /* Minimalist Greeting */
        h1 {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 24px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Popup Notification Styling */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-box {
            background-color: #2b2b2b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 24px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .popup-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-message {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Highlight text within popup */
        .highlight {
            color: #ff5252;
            font-weight: 600;
        }
        
        .success {
            color: #4caf50;
            font-weight: 600;
        }

        .popup-btn {
            background-color: #0078d4;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            float: right;
        }

        .popup-btn:hover {
            background-color: #106ebe;
        }
    </style>
</head>
<body>

    <!-- Background Wallpaper -->
    <div class="background"></div>

    <!-- Main Content Area -->
    <div class="content">
        <h1>404 Not Found</h1>
    </div>

    <!-- Alert Popup Modal -->
    
</html>
